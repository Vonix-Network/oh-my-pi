<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="dark" />
		<title>omp — Jarvis</title>
		<link rel="stylesheet" href="./styles.css" />
		<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
	</head>
	<body>
		<div class="shell" id="shell" data-phase="boot">
			<!-- ── Core ────────────────────────────────────────────────────── -->
			<section class="core" aria-label="Voice core">
				<canvas id="orb" class="orb" width="640" height="640" aria-hidden="true"></canvas>
				<div class="core-overlay">
					<p class="phase-label" id="phase-label">INITIALISING</p>
					<p class="phase-detail" id="phase-detail">connecting to omp</p>
				</div>
				<div class="core-ring" aria-hidden="true"></div>
			</section>

			<!-- ── Status rail ─────────────────────────────────────────────── -->
			<header class="rail" aria-label="Session status">
				<div class="rail-brand">
					<span class="brand-mark" aria-hidden="true"></span>
					<span class="brand-name">omp<span class="brand-sub">jarvis</span></span>
				</div>
				<dl class="rail-stats">
					<div class="stat"><dt>model</dt><dd id="stat-model" title="active model">—</dd></div>
					<div class="stat"><dt>effort</dt><dd id="stat-effort">—</dd></div>
					<div class="stat"><dt>context</dt><dd id="stat-context">—</dd></div>
					<div class="stat"><dt>tok/s</dt><dd id="stat-tps">—</dd></div>
				</dl>
				<div class="rail-right">
					<span class="link-state" id="link-state" data-state="connecting"><span class="dot" aria-hidden="true"></span><span id="link-text">connecting</span></span>
				</div>
			</header>

			<!-- ── Transcript ──────────────────────────────────────────────── -->
			<main class="stream-wrap" aria-label="Conversation">
				<ol class="stream" id="stream" role="log" aria-live="polite" aria-relevant="additions text">
					<li class="empty" id="stream-empty">
						<p>Hold <kbd>Space</kbd> and speak, or type below.</p>
						<p class="muted" id="voice-support">checking speech support…</p>
					</li>
				</ol>
			</main>

			<!-- ── Controls ────────────────────────────────────────────────── -->
			<footer class="controls" aria-label="Controls">
				<div class="ctrls-row">
					<button class="mic" id="mic" type="button" aria-pressed="false" aria-describedby="mic-hint">
						<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
							<path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z" />
							<path d="M5 11a7 7 0 0 0 14 0M12 18v3" fill="none" stroke-width="1.8" stroke-linecap="round" />
						</svg>
						<span class="mic-label" id="mic-hint">hold to talk</span>
					</button>

					<form class="composer" id="composer" autocomplete="off">
						<label class="sr-only" for="input">Message</label>
						<textarea id="input" rows="1" placeholder="Ask omp, or hold Space to speak…" spellcheck="false"></textarea>
						<button class="send" id="send" type="submit" aria-label="Send message">
							<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 12h13M11 6l6 6-6 6" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
						</button>
					</form>

					<div class="acts">
						<button class="act" id="btn-stop" type="button" title="Stop the current turn (Esc)" disabled>
							<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="7" y="7" width="10" height="10" rx="1.5" /></svg>
							<span>stop</span>
						</button>
						<button class="act" id="btn-voice" type="button" aria-pressed="true" title="Speak replies aloud">
							<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9h3l4-3.5v13L7 15H4z" /><path d="M15 8.5a5 5 0 0 1 0 7M18 6a8 8 0 0 1 0 12" fill="none" stroke-width="1.7" stroke-linecap="round" /></svg>
							<span>voice</span>
						</button>
						<button class="act" id="btn-new" type="button" title="Start a new session">
							<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14" fill="none" stroke-width="2" stroke-linecap="round" /></svg>
							<span>new</span>
						</button>
					</div>
				</div>
				<p class="hint" id="status-hint">Hold <kbd>Space</kbd> to talk · <kbd>Esc</kbd> stops the turn · <kbd>Enter</kbd> sends</p>
			</footer>

			<div class="toast-stack" id="toasts" aria-live="assertive"></div>
		</div>
		<script type="module" src="./app.js"></script>
	</body>
</html>
